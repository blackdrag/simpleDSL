name: build

on:
  push:
  pull_request:

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - run: mvn -q package
      - run: sh scripts/integration-test.sh
